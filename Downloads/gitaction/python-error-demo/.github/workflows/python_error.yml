name: Python Error Demo

on: [push]

jobs:
  detect-error:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Run failing script
      run: python failing_script.py' > .github/workflows/python_error.yml